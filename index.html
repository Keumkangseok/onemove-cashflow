<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONEMOVE 정산</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{--bg:#f7f8fb;--bg2:#ffffff;--bg3:#f1f5f9;--border:rgba(15,23,42,0.09);--border2:rgba(15,23,42,0.16);--text:#111827;--text2:#475569;--text3:#94a3b8;--green:#16a34a;--red:#dc2626;--blue:#2563eb;--amber:#d97706;--purple:#7c3aed;--r:14px;--rs:9px;--shadow:0 10px 30px rgba(15,23,42,.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,#ffffff 0%,var(--bg) 100%);color:var(--text);font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;min-height:100vh}
/* 최상단 모드 탭 */
.mode-bar{display:flex;background:rgba(255,255,255,.92);border-bottom:1px solid var(--border);box-shadow:0 2px 12px rgba(15,23,42,.04);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
.mode-tab{flex:1;padding:14px;text-align:center;font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;border-bottom:3px solid transparent}
.mode-tab.on{color:var(--green);border-bottom-color:var(--green);background:rgba(22,163,74,.08)}
/* 헤더 */
.header{padding:20px 28px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fff}
.logo{font-size:17px;font-weight:700;letter-spacing:.08em}.logo span{color:var(--green)}
.hbadge{font-size:12px;color:var(--text2);background:var(--bg3);padding:6px 13px;border-radius:100px;border:1px solid var(--border);font-weight:600}
/* 업로드 */
.upload-wrap{padding:36px 28px}
.upload-title{font-size:20px;font-weight:600;margin-bottom:6px}
.upload-sub{font-size:13px;color:var(--text2);margin-bottom:24px;line-height:1.6}
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:640px}
.ubox{border:1.5px dashed var(--border2);border-radius:var(--r);padding:26px;text-align:center;cursor:pointer;transition:all .2s;position:relative;background:#fff;box-shadow:var(--shadow)}
.ubox:hover,.ubox.over{border-color:var(--green);background:rgba(22,163,74,.06);transform:translateY(-1px)}
.ubox.done{border-color:var(--green);border-style:solid;background:rgba(22,163,74,.08)}
.ubox input{position:absolute;inset:0;opacity:0;cursor:pointer}
.uicon{font-size:26px;margin-bottom:8px}
.ulabel{font-size:13px;font-weight:600;margin-bottom:3px}
.uhint{font-size:11px;color:var(--text3)}
.ufname{font-size:11px;color:var(--green);margin-top:6px;font-weight:500}
.abtn{margin-top:18px;background:var(--green);color:#fff;font-size:14px;font-weight:800;padding:13px 38px;border:none;border-radius:var(--rs);cursor:pointer;letter-spacing:.04em;transition:all .2s;box-shadow:0 8px 18px rgba(22,163,74,.18)}
.abtn:disabled{opacity:.3;cursor:not-allowed}
.abtn:not(:disabled):hover{opacity:.95;transform:translateY(-1px)}
.errmsg{background:rgba(231,76,60,.12);border:1px solid rgba(231,76,60,.3);border-radius:var(--rs);padding:10px 14px;font-size:13px;color:#f87171;margin-top:14px;display:none}
/* 로딩 */
.loading{display:none;text-align:center;padding:60px}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
/* 대시보드 공통 */
.dash{display:none;padding:0 28px 48px}
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:20px;padding-top:16px;overflow-x:auto}
.tab{padding:9px 16px;font-size:13px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:all .15s}
.tab.on{color:var(--green);border-bottom-color:var(--green);font-weight:800;background:rgba(22,163,74,.06)}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.metric{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.ml{font-size:10px;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.mv{font-size:19px;font-weight:700}
.mv.g{color:var(--green)}.mv.r{color:var(--red)}.mv.b{color:var(--blue)}.mv.o{color:var(--amber)}
.ms{font-size:11px;color:var(--text3);margin-top:3px}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;gap:8px}
.row:last-child{border-bottom:none}
.row.sub{padding-left:14px}
.row.sub .rn{font-size:12px;color:var(--text2)}
.row.tot{border-top:1px solid var(--border2);padding-top:10px;margin-top:3px;font-weight:700;border-bottom:none}
.row.clk{cursor:pointer;border-radius:var(--rs);transition:background .15s;user-select:none}
.row.clk:hover{background:rgba(15,23,42,.04);margin:0 -6px;padding-left:6px;padding-right:6px}
.rn{flex:2;min-width:0}
.ra{font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ra.g{color:var(--green)}.ra.r{color:var(--red)}.ra.n{color:var(--text2)}.ra.b{color:var(--blue)}.ra.o{color:var(--amber)}
.bdg{display:inline-block;font-size:10px;padding:1px 6px;border-radius:100px;margin:0 4px}
.bc{background:rgba(37,99,235,.12);color:#1d4ed8}
.bp{background:rgba(22,163,74,.12);color:#15803d}
.dtag{font-size:11px;padding:2px 7px;border-radius:100px;background:var(--bg3);color:var(--text2);white-space:nowrap}
.dtag.hot{background:rgba(217,119,6,.12);color:#b45309}
/* 드릴다운 */
.drill{display:none;background:#f8fafc;border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;margin:6px 0 8px}
.drill.open{display:block}
.dg{margin-bottom:8px}
.dgh{display:flex;justify-content:space-between;padding:2px 0 5px;border-bottom:1px solid var(--border);margin-bottom:3px}
.dgl{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.dgdot{width:6px;height:6px;border-radius:50%}
.dgt{font-size:12px;font-weight:700}
.di{display:flex;align-items:center;padding:5px 0;font-size:12px;gap:6px;border-bottom:1px solid rgba(15,23,42,.06)}
.di:last-child{border-bottom:none}
.ddate{color:var(--text3);min-width:38px;font-size:11px}
.dname{color:var(--text2);flex:1}
.dbk{font-size:9px;padding:1px 5px;border-radius:100px}
.damt{color:var(--red);font-weight:600;min-width:72px;text-align:right;font-variant-numeric:tabular-nums}
.dsubt{display:flex;justify-content:space-between;padding:5px 0 0;margin-top:3px;border-top:1px solid var(--border2);font-size:12px;font-weight:700}
.earr{font-size:10px;color:var(--text3);margin-left:4px;display:inline-block;transition:transform .2s}
.earr.open{transform:rotate(180deg)}
/* 알림 */
.alert{border-radius:var(--rs);padding:9px 12px;margin-bottom:12px;font-size:12px;line-height:1.6}
.ai{background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.22);color:#1d4ed8}
.aw{background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.24);color:#b45309}
.as{background:rgba(22,163,74,.08);border:1px solid rgba(22,163,74,.24);color:#15803d}
.sec{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin:18px 0 8px}
/* 비교테이블 */
.ct{width:100%;border-collapse:collapse;font-size:13px}
.ct th{font-size:11px;font-weight:600;color:var(--text3);padding:7px 10px;text-align:right;border-bottom:1px solid var(--border2)}
.ct th:first-child{text-align:left}
.ct td{padding:7px 10px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
.ct td:first-child{text-align:left;color:var(--text2)}
.ct tr.tot td{font-weight:700;border-top:1px solid var(--border2);border-bottom:none;color:var(--green)}
.ct tr.sub td:first-child{padding-left:22px;font-size:12px;color:var(--text3)}
/* 고정비테이블 */
.ft{width:100%;font-size:13px;border-collapse:collapse}
.ft th{font-size:11px;color:var(--text3);font-weight:600;padding:6px 10px;text-align:left;border-bottom:1px solid var(--border2)}
.ft td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
.ft tr:last-child td{border-bottom:none}
.ft .amt{text-align:right;font-variant-numeric:tabular-nums;color:var(--red);font-weight:600}
.cw{position:relative;width:100%;margin-top:6px}
.new-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:100px;background:rgba(22,163,74,.12);color:var(--green);margin-left:6px;vertical-align:middle;font-weight:700}

/* Light UI visibility upgrades */
.ct th,.ft th{background:#f8fafc;color:#64748b}
.ct tr:hover td,.ft tr:hover td{background:#fbfdff}
.tabs{background:#fff;border-radius:var(--r) var(--r) 0 0;padding-left:4px;padding-right:4px}
.cw{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.logo span{color:var(--green)}
</style>
</head>

        <div class="uhint">카카오뱅크 엑셀</div>
        <div class="ufname" id="pers-fn"></div>

    </div>
    <button class="abtn" id="abtn" disabled onclick="analyze()">정산 분석하기</button>
    <div class="errmsg" id="errmsg"></div>
  </div>
  <div class="loading" id="loading"><div class="spinner"></div><div style="color:var(--text2);font-size:13px">분류 중...</div></div>
  <div class="dash" id="dash-new">

  </div>
</div>

let charts={};

function fmt(n){return(n===undefined||n===null||isNaN(n))?'-':Math.round(n).toLocaleString();}
function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}

function toggleDrill(did, event){
  if(event){ event.preventDefault(); event.stopPropagation(); }
  const panel=document.getElementById('drill-'+did);
  const icon=document.getElementById('earr-'+did);
  if(!panel) return;
  const open=panel.classList.contains('open');
  panel.classList.toggle('open',!open);
  if(icon) icon.classList.toggle('open',!open);
}

document.addEventListener('click', function(e){
  const row=e.target.closest && e.target.closest('.row.clk[data-drill]');
  if(!row) return;
  toggleDrill(row.getAttribute('data-drill'), e);
});

document.addEventListener('keydown', function(e){
  if((e.key==='Enter' || e.key===' ') && e.target.classList && e.target.classList.contains('clk')){
    toggleDrill(e.target.getAttribute('data-drill'), e);
  }
});

function switchMode(m){
  document.getElementById('mode-saved').style.display = m==='saved'?'':'none';
  document.getElementById('mode-new').style.display = m==='new'?'':'none';
  document.getElementById('mt-saved').classList.toggle('on', m==='saved');
  document.getElementById('mt-new').classList.toggle('on', m==='new');
  document.getElementById('hbadge').textContent = m==='saved'?'2026년 3~5월':'새 달 분석';
  destroyCharts();
  if(m==='saved') renderDash('saved', SAVED.results, SAVED.months);
}

function renderDash(id, results, months){
  const tabEl = document.getElementById('tabs-'+id);
  const defs = [
    {key:'summary',label:'월별 요약'},
    {key:'revenue',label:'매출 분석'},
    {key:'fixed',label:'고정비'},
    ...months.map(m=>({key:'m'+m, label:MN[m]}))
  ];
  tabEl.innerHTML = defs.map((t,i)=>`<div class="tab ${i===0?'on':''}" onclick="swTab('${id}','${t.key}')">${t.label}</div>`).join('');
  swTab(id,'summary');
}

function swTab(id, key){
  destroyCharts();
  document.querySelectorAll(`#tabs-${id} .tab`).forEach((el,i)=>{
    const keys=['summary','revenue','fixed',...(id==='saved'?SAVED.months:newMonths).map(m=>'m'+m)];
    el.classList.toggle('on', keys[i]===key);
  });
  const results = id==='saved' ? SAVED.results : newResults;
  const months = id==='saved' ? SAVED.months : newMonths;
  const el = document.getElementById('content-'+id);
  if(key==='summary') el.innerHTML = renderSummary(results,months);
  else if(key==='revenue') el.innerHTML = renderRevenue(results,months);
  else if(key==='fixed') el.innerHTML = renderFixed(results,months);
  else{
    const m=parseInt(key.replace('m',''));
    el.innerHTML = renderMonth(results[m], MN[m]);
  }
  requestAnimationFrame(()=>drawCharts(key,results,months));
}

    drillHTML+=`<div class="dg">

function clsCI(n,m,a){for(const r of CR_IN){if(r.fn&&r.fn({name:n,memo:m,amt:a}))return r.cat;if(r.keys&&r.keys.some(k=>n.includes(k)))return r.cat;}return '매출_기타';}
function clsCO(n,m,a){for(const r of CR_OUT){if(r.fn&&r.fn({name:n,memo:m,out:a}))return r.cat;if(r.memo&&r.keys&&r.keys.some(k=>(m||'').includes(k)))return r.cat;if(!r.memo&&r.keys&&r.keys.some(k=>n.includes(k)))return r.cat;}return '지출_기타';}
function clsPI(n,m,a){for(const r of PR_IN){if(r.fn&&r.fn({name:n,memo:m,amt:a}))return r.cat;if(r.keys&&r.keys.some(k=>n.includes(k)))return r.cat;}return '매출_회원권';}
function clsPO(n,m,a){for(const r of PR_OUT){if(r.fn&&r.fn({name:n,memo:m,amt:a}))return r.cat;if(r.keys&&r.keys.some(k=>n.includes(k)))return r.cat;}return '변동_기타';}

function readXlsx(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const s={};wb.SheetNames.forEach(n=>{s[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:''});});res(s);}catch(err){rej(err);}};r.onerror=rej;r.readAsArrayBuffer(f);});}

function parseCorpSheet(rows){
  const tx=[];
  for(const row of rows){
    const ds=String(row[2]||'');
    if(!ds.match(/^\d{4}\.\d{2}\.\d{2}/))continue;
    const date=ds.substring(0,10).replace(/\./g,'-');
    const name=String(row[6]||'').trim();
    const memo=String(row[10]||row[11]||'').trim();
    const inA=parseFloat(String(row[4]).replace(/,/g,''))||0;
    const outA=parseFloat(String(row[5]).replace(/,/g,''))||0;
    const bal=parseFloat(String(row[7]).replace(/,/g,''))||0;
    if(!name||(inA===0&&outA===0))continue;
    const cat=inA>0?clsCI(name,memo,inA):clsCO(name,memo,outA);
    tx.push({date,name,memo,in:inA,out:outA,bal,cat,src:'법인'});
  }
  return tx.sort((a,b)=>a.date.localeCompare(b.date));
}

function parsePersSheet(rows){
  let hi=-1;
  for(let i=0;i<rows.length;i++){if(rows[i].some(c=>String(c).includes('거래일시'))){hi=i;break;}}
  if(hi<0)throw new Error('개인 내역 헤더를 찾을 수 없습니다.');
  const tx=[];
  for(let i=hi+1;i<rows.length;i++){
    const row=rows[i];
    const ds=String(row[1]||'').trim();
    if(!ds.match(/^\d{4}\.\d{2}\.\d{2}/))continue;
    const type=String(row[2]||'').trim();
    if(!['입금','출금'].includes(type))continue;
    const date=ds.substring(0,10).replace(/\./g,'-');
    const amt=Math.abs(parseFloat(String(row[3]).replace(/,/g,''))||0);
    const name=String(row[6]||'').trim();
    const memo=String(row[7]||'').trim();
    const bal=parseFloat(String(row[4]).replace(/,/g,''))||0;
    if(!name||amt===0)continue;
    const cat=type==='입금'?clsPI(name,memo,amt):clsPO(name,memo,amt);
    tx.push({date,name,memo,type,amt,bal,cat,src:'개인'});
  }
  return tx.sort((a,b)=>a.date.localeCompare(b.date));
}

const FIXED_C=['고정비_임대료','고정비_임대관리비','고정비_법인카드결제','고정비_렌탈','고정비_통신비','고정비_세무수수료','고정비_기타','고정비_알고케어','고정비_마케팅(텐텐)','고정비_알바비'];
const FIXED_P=['고정비_인건비(이동신)','고정비_인건비(요가)','고정비_인건비(로몬)','고정비_인테리어할부','고정비_마케팅(플레이스)','고정비_마케팅(텐텐)'];
const REV_C=['매출_카드정산','매출_온라인(쿠팡)'];
const REV_P=['매출_회원권','매출_단기권','매출_시루정산','매출_천원냉장고','매출_소액기타','매출_온라인(의류)','매출_기타'];

function calcMonth(cTx,pTx,m){
  const cm=cTx.filter(t=>getMonth(t.date)===m);
  const pm=pTx.filter(t=>getMonth(t.date)===m);
  let cs=0,ce=0,ps=0,pe=0;
  if(cm.length){const f=cm[0];cs=f.in>0?f.bal-f.in:f.bal+f.out;ce=cm[cm.length-1].bal;}
  if(pm.length){const f=pm[0];ps=f.type==='출금'?f.bal+f.amt:f.bal-f.amt;pe=pm[pm.length-1].bal;}
  const cr=cm.filter(t=>REV_C.includes(t.cat)).reduce((s,t)=>s+t.in,0);
  const pr=pm.filter(t=>t.type==='입금'&&REV_P.includes(t.cat)).reduce((s,t)=>s+t.amt,0);
  const fc=cm.filter(t=>FIXED_C.includes(t.cat)).reduce((s,t)=>s+t.out,0);
  const fp=pm.filter(t=>t.type==='출금'&&FIXED_P.includes(t.cat)).reduce((s,t)=>s+t.amt,0);
  const vc=cm.filter(t=>t.cat.startsWith('변동_')).reduce((s,t)=>s+t.out,0);
  const vp=pm.filter(t=>t.type==='출금'&&t.cat.startsWith('변동_')).reduce((s,t)=>s+t.amt,0);
  const spC=cm.filter(t=>t.cat.startsWith('특수_')).reduce((s,t)=>s+t.out,0);
  const spP=pm.filter(t=>t.type==='출금'&&t.cat.startsWith('특수_')).reduce((s,t)=>s+t.amt,0);
  const varItems=[];
  cm.filter(t=>t.cat.startsWith('변동_')).forEach(t=>varItems.push({date:t.date.substring(5),name:t.name,cat:t.cat.replace('변동_',''),amt:t.out,bank:'법인',memo:t.memo}));
  pm.filter(t=>t.type==='출금'&&t.cat.startsWith('변동_')).forEach(t=>varItems.push({date:t.date.substring(5),name:t.name,cat:t.cat.replace('변동_',''),amt:t.amt,bank:'개인',memo:t.memo}));
  varItems.sort((a,b)=>a.date.localeCompare(b.date));
  const specialItems=[];
  cm.filter(t=>t.cat.startsWith('특수_')).forEach(t=>specialItems.push({date:t.date.substring(5),name:t.name,cat:t.cat.replace('특수_',''),amt:t.out,bank:'법인',memo:t.memo}));
  pm.filter(t=>t.type==='출금'&&t.cat.startsWith('특수_')).forEach(t=>specialItems.push({date:t.date.substring(5),name:t.name,cat:t.cat.replace('특수_',''),amt:t.amt,bank:'개인',memo:t.memo}));
  specialItems.sort((a,b)=>a.date.localeCompare(b.date));
  const fixedDetail=[];
  cm.filter(t=>FIXED_C.includes(t.cat)).forEach(t=>fixedDetail.push({name:t.name,amt:t.out,bank:'법인'}));
  pm.filter(t=>t.type==='출금'&&FIXED_P.includes(t.cat)).forEach(t=>fixedDetail.push({name:t.name,amt:t.amt,bank:'개인'}));
  return {
    month:m,corpStart:cs,corpEnd:ce,persStart:ps,persEnd:pe,totalStart:cs+ps,totalEnd:ce+pe,
    totalRev:cr+pr,cardRev:cm.filter(t=>t.cat==='매출_카드정산').reduce((s,t)=>s+t.in,0),
    siruRev:pm.filter(t=>t.type==='입금'&&t.cat==='매출_시루정산').reduce((s,t)=>s+t.amt,0),
    cashMem:pm.filter(t=>t.type==='입금'&&t.cat==='매출_회원권').reduce((s,t)=>s+t.amt,0),
    cashShort:pm.filter(t=>t.type==='입금'&&t.cat==='매출_단기권').reduce((s,t)=>s+t.amt,0),
    fridge:pm.filter(t=>t.type==='입금'&&t.cat==='매출_천원냉장고').reduce((s,t)=>s+t.amt,0),
    etcRev:pm.filter(t=>t.type==='입금'&&['매출_온라인(의류)','매출_소액기타','매출_기타'].includes(t.cat)).reduce((s,t)=>s+t.amt,0),
    totalFixed:fc+fp,fixedCorp:fc,fixedPers:fp,totalVar:vc+vp,varCorp:vc,varPers:vp,
    totalSpecial:spC+spP,opIncome:(cr+pr)-(fc+fp)-(vc+vp),
    varDetail:varItems,specialDetail:specialItems,fixedDetail
  };
}

async function analyze(){
  document.getElementById('errmsg').style.display='none';
  document.getElementById('upload-wrap').style.display='none';
  document.getElementById('loading').style.display='block';
  try{
    const [cS,pS]=await Promise.all([readXlsx(files.corp),readXlsx(files.pers)]);
    const cTx=parseCorpSheet(Object.values(cS)[0]);
    const pTx=parsePersSheet(Object.values(pS)[0]);
    const months=[...new Set([...cTx,...pTx].map(t=>getMonth(t.date)))].sort();
    newMonths=months;
    months.forEach(m=>{newResults[m]=calcMonth(cTx,pTx,m);});
    document.getElementById('loading').style.display='none';
    document.getElementById('dash-new').style.display='block';
    const yr=cTx[0]?.date.substring(0,4)||new Date().getFullYear();
    document.getElementById('hbadge').textContent=`${yr}년 ${months[0]}~${months[months.length-1]}월`;
    renderDash('new',newResults,newMonths);
  }catch(err){
    document.getElementById('loading').style.display='none';
    document.getElementById('upload-wrap').style.display='block';
    const em=document.getElementById('errmsg');
    em.textContent='오류: '+err.message;em.style.display='block';
  }
}

// 초기 렌더링
renderDash('saved', SAVED.results, SAVED.months);
</script>
