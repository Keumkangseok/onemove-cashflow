<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONEMOVE 월별 정산</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --bg: #0f0f0f;
  --bg2: #1a1a1a;
  --bg3: #222;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0f0f0;
  --text2: #999;
  --text3: #666;
  --green: #2ecc71;
  --green2: #1a7a44;
  --red: #e74c3c;
  --red2: #7a1a1a;
  --blue: #3b82f6;
  --amber: #f59e0b;
  --purple: #8b5cf6;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; min-height: 100vh; }

/* 헤더 */
.header { padding: 24px 32px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 18px; font-weight: 700; letter-spacing: .08em; }
.logo span { color: var(--green); }
.month-badge { font-size: 13px; color: var(--text2); background: var(--bg2); padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border); }

/* 업로드 영역 */
.upload-section { padding: 40px 32px; }
.upload-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.upload-sub { font-size: 14px; color: var(--text2); margin-bottom: 28px; line-height: 1.6; }
.upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 700px; }
.upload-box { border: 1.5px dashed var(--border2); border-radius: var(--radius); padding: 28px 24px; text-align: center; cursor: pointer; transition: all .2s; position: relative; }
.upload-box:hover, .upload-box.dragover { border-color: var(--green); background: rgba(46,204,113,.06); }
.upload-box.done { border-color: var(--green); border-style: solid; background: rgba(46,204,113,.08); }
.upload-icon { font-size: 28px; margin-bottom: 10px; }
.upload-label { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.upload-hint { font-size: 12px; color: var(--text3); }
.upload-box input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.upload-filename { font-size: 12px; color: var(--green); margin-top: 8px; font-weight: 500; }
.analyze-btn { margin-top: 20px; background: var(--green); color: #000; font-size: 15px; font-weight: 700; padding: 14px 40px; border: none; border-radius: var(--radius-sm); cursor: pointer; letter-spacing: .04em; transition: opacity .2s; }
.analyze-btn:disabled { opacity: .35; cursor: not-allowed; }
.analyze-btn:not(:disabled):hover { opacity: .88; }

/* 대시보드 */
.dashboard { display: none; padding: 0 32px 48px; }

/* 탭 */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 24px; padding-top: 20px; }
.tab { padding: 10px 18px; font-size: 13px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all .15s; }
.tab.on { color: var(--text); border-bottom-color: var(--green); font-weight: 600; }

/* 메트릭 카드 */
.mg { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.metric { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.metric-label { font-size: 11px; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; margin-bottom: 6px; }
.metric-value { font-size: 20px; font-weight: 700; }
.metric-value.g { color: var(--green); }
.metric-value.r { color: var(--red); }
.metric-value.b { color: var(--blue); }
.metric-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* 카드 */
.card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; }
.card-title { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 14px; }

/* 행 */
.row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; gap: 8px; }
.row:last-child { border-bottom: none; }
.row.sub { padding-left: 16px; }
.row.sub .row-name { font-size: 12px; color: var(--text2); }
.row.total { border-top: 1px solid var(--border2); padding-top: 12px; margin-top: 4px; font-weight: 700; border-bottom: none; }
.row.clickable { cursor: pointer; border-radius: var(--radius-sm); transition: background .15s; }
.row.clickable:hover { background: rgba(255,255,255,.04); margin: 0 -8px; padding: 7px 8px; }
.row-name { flex: 2; min-width: 0; }
.row-amt { font-weight: 600; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.row-amt.g { color: var(--green); }
.row-amt.r { color: var(--red); }
.row-amt.n { color: var(--text2); }
.row-amt.b { color: var(--blue); }
.row-amt.o { color: var(--amber); }

/* 뱃지 */
.bdg { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 100px; margin: 0 5px; }
.bdg-corp { background: rgba(59,130,246,.2); color: #7bb3ff; }
.bdg-pers { background: rgba(46,204,113,.15); color: #6fe0a0; }
.bdg-hot { background: rgba(245,158,11,.15); color: #fbbf24; }
.date-tag { font-size: 11px; padding: 2px 8px; border-radius: 100px; background: var(--bg3); color: var(--text2); white-space: nowrap; }
.date-tag.hot { background: rgba(245,158,11,.15); color: #fbbf24; }

/* 드릴다운 */
.drill { display: none; background: var(--bg3); border-radius: var(--radius-sm); padding: 12px 14px; margin: 4px 0 8px; }
.drill.open { display: block; }
.drill-group { margin-bottom: 10px; }
.drill-group-header { display: flex; justify-content: space-between; align-items: center; padding: 3px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.drill-cat-label { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
.drill-cat-dot { width: 6px; height: 6px; border-radius: 50%; }
.drill-cat-total { font-size: 12px; font-weight: 700; color: var(--text); }
.drill-item { display: flex; align-items: center; padding: 3px 0; font-size: 12px; gap: 6px; border-bottom: 1px solid rgba(255,255,255,.04); }
.drill-item:last-child { border-bottom: none; }
.drill-date { color: var(--text3); min-width: 40px; font-size: 11px; }
.drill-name { color: var(--text2); flex: 1; }
.drill-bank { font-size: 9px; padding: 1px 5px; border-radius: 100px; }
.drill-item-amt { color: var(--red); font-weight: 600; min-width: 75px; text-align: right; font-variant-numeric: tabular-nums; }
.drill-subtotal { display: flex; justify-content: space-between; padding: 6px 0 0; margin-top: 4px; border-top: 1px solid var(--border2); font-size: 12px; font-weight: 700; }
.expand-arrow { font-size: 10px; color: var(--text3); margin-left: 5px; display: inline-block; transition: transform .2s; }
.expand-arrow.open { transform: rotate(180deg); }

/* 차트 */
.chart-wrap { position: relative; width: 100%; margin-top: 8px; }

/* 알림 박스 */
.alert { border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 14px; font-size: 12px; line-height: 1.6; }
.alert-info { background: rgba(59,130,246,.1); border: 1px solid rgba(59,130,246,.25); color: #93c5fd; }
.alert-warn { background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.25); color: #fcd34d; }
.alert-success { background: rgba(46,204,113,.1); border: 1px solid rgba(46,204,113,.25); color: #6ee7b7; }

/* 섹션 타이틀 */
.sec { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: .07em; text-transform: uppercase; margin: 20px 0 10px; }

/* 비교 테이블 */
.compare-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare-table th { font-size: 11px; font-weight: 600; color: var(--text3); padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border2); }
.compare-table th:first-child { text-align: left; }
.compare-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
.compare-table td:first-child { text-align: left; color: var(--text2); }
.compare-table tr.total td { font-weight: 700; border-top: 1px solid var(--border2); border-bottom: none; color: var(--green); }
.compare-table tr.sub td:first-child { padding-left: 24px; font-size: 12px; color: var(--text3); }

/* 로딩 */
.loading { display: none; text-align: center; padding: 60px; }
.loading-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-msg { background: rgba(231,76,60,.12); border: 1px solid rgba(231,76,60,.3); border-radius: var(--radius-sm); padding: 12px 16px; font-size: 13px; color: #f87171; margin-top: 16px; display: none; }

/* 고정비 테이블 */
.fixed-table { width: 100%; font-size: 13px; border-collapse: collapse; }
.fixed-table th { font-size: 11px; color: var(--text3); font-weight: 600; padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border2); }
.fixed-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.fixed-table tr:last-child td { border-bottom: none; }
.fixed-table .amt { text-align: right; font-variant-numeric: tabular-nums; color: var(--red); font-weight: 600; }
.fixed-total-row td { font-weight: 700; border-top: 1px solid var(--border2); color: var(--text); }

/* 새 정산 버튼 */
.reset-btn { font-size: 12px; color: var(--text3); background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 14px; cursor: pointer; transition: all .15s; }
.reset-btn:hover { border-color: var(--border2); color: var(--text2); }
</style>
</head>
<body>

<div class="header">
  <div class="logo">ONE<span>MOVE</span> 정산</div>
  <div id="month-badge" class="month-badge">파일을 업로드해주세요</div>
</div>

<!-- 업로드 섹션 -->
<div class="upload-section" id="upload-section">
  <div class="upload-title">월별 정산 분석</div>
  <div class="upload-sub">법인 통장과 개인 통장 내역을 업로드하면 자동으로 분류·정산합니다.<br>카카오뱅크 엑셀 / 시화은행 BZ뱅크 엑셀 형식을 지원합니다.</div>

  <div class="upload-grid">
    <div class="upload-box" id="corp-box" ondragover="handleDrag(event,'corp')" ondragleave="handleDragLeave(event,'corp')" ondrop="handleDrop(event,'corp')">
      <input type="file" accept=".xlsx,.xls" onchange="handleFile(event,'corp')">
      <div class="upload-icon">🏢</div>
      <div class="upload-label">법인 통장</div>
      <div class="upload-hint">시화은행 엑셀 파일</div>
      <div class="upload-filename" id="corp-filename"></div>
    </div>
    <div class="upload-box" id="pers-box" ondragover="handleDrag(event,'pers')" ondragleave="handleDragLeave(event,'pers')" ondrop="handleDrop(event,'pers')">
      <input type="file" accept=".xlsx,.xls" onchange="handleFile(event,'pers')">
      <div class="upload-icon">👤</div>
      <div class="upload-label">개인 통장</div>
      <div class="upload-hint">카카오뱅크 엑셀 파일</div>
      <div class="upload-filename" id="pers-filename"></div>
    </div>
  </div>

  <button class="analyze-btn" id="analyze-btn" disabled onclick="analyze()">정산 분석하기</button>
  <div class="error-msg" id="error-msg"></div>
</div>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div style="color:var(--text2);font-size:14px">분류 중...</div>
</div>

<!-- 대시보드 -->
<div class="dashboard" id="dashboard">
  <div class="tabs" id="tabs"></div>
  <div id="tab-content"></div>
</div>

<script>
// ============================================================
// 분류 룰 (확정된 기준)
// ============================================================
const CORP_RULES = {
  in: [
    { keys: ['주식회사 9052','토스매출'], cat: '매출_카드정산' },
    { keys: ['쿠팡매출'], cat: '매출_온라인(쿠팡)' },
    { keys: ['이기현'], cat: '매출_시루정산' },
    { keys: ['추윤호','조희설'], cat: '내부_가지급금환급' },
    { keys: ['금강석'], cat: '내부이체_개→법' },
    { keys: ['시흥세무서'], cat: '기타수입' },
    { keys: ['DBSL'], cat: '기타수입' },
  ],
  out: [
    { keys: ['050.베니스 월'], cat: '고정비_임대료' },
    { fn: r => r.name.includes('배곧베니스') && r.out >= 500000, cat: '고정비_임대관리비' },
    { fn: r => r.name.includes('배곧베니스') && r.out < 500000, cat: '고정비_임대기타' },
    { keys: ['신한카드법인','아마존카'], cat: '고정비_법인카드결제' },
    { keys: ['에브리렌탈'], cat: '고정비_렌탈' },
    { keys: ['코코렌탈'], cat: '고정비_렌탈' },
    { keys: ['LGU+'], cat: '고정비_통신비' },
    { keys: ['아이샵케어'], cat: '고정비_기타' },
    { keys: ['대성세무회계'], cat: '고정비_세무수수료' },
    { keys: ['알고케어'], cat: '고정비_알고케어' },
    { keys: ['신지원','아브뉴'], cat: '특수_구사무실(종료)' },
    { keys: ['홍성미'], cat: '고정비_마케팅(텐텐)' },
    { keys: ['레뷰'], cat: '변동_마케팅' },
    { keys: ['네이버광고','네이버 9052'], cat: '변동_마케팅' },
    { keys: ['애드피아몰'], cat: '변동_마케팅' },
    { keys: ['백주현'], cat: '변동_마케팅' },
    { keys: ['종이족자'], cat: '변동_마케팅' },
    { keys: ['포스터'], cat: '변동_마케팅' },
    { keys: ['김대성','이센셜'], cat: '변동_장비(심박수)' },
    { keys: ['안용식'], cat: '특수_세무조정' },
    { keys: ['권준학'], cat: '고정비_알바비(권준학)' },
    { fn: r => r.name.includes('이기현'), cat: '특수_투자회수' },
    { fn: r => r.name.includes('Npay') && r.out > 1000000, cat: '변동_기자재' },
    { keys: ['Npay','쿠팡'], cat: '변동_소모품' },
    { keys: ['주식회사 9052'], cat: '내부이체_법→개' },
    { keys: ['랫풀다운'], cat: '내부_가수금환급' },
    { keys: ['국고','경기시흥','사업소득세','지방세'], cat: '세금' },
    { keys: ['관리비 12,1'], cat: '특수_구사무실(종료)' },
    { keys: ['020.추가 주차'], cat: '고정비_임대기타' },
    { keys: ['음료구매'], cat: '변동_소모품' },
    { keys: ['블라인드'], cat: '변동_소모품', memo: true },
  ]
};

const PERS_RULES = {
  in: [
    { fn: r => r.amt <= 2, cat: '기타_소액' },
    { fn: r => r.amt <= 3000, cat: '매출_천원냉장고' },
    { keys: ['이기현'], cat: '매출_시루정산' },
    { keys: ['입출금통장 이자','예금이자'], cat: '기타_이자' },
    { keys: ['캐시백'], cat: '기타_캐시백' },
    { keys: ['환불'], cat: '매출조정_환불입금' },
    { keys: ['의류판매'], cat: '매출_온라인(의류)' },
    { fn: r => r.amt === 5000, cat: '매출_소액기타' },
    { fn: r => [88400,66700,50900].includes(r.amt), cat: '엠티_참가비' },
    { keys: ['금강석'], cat: '내부이체_법→개' },
    { fn: r => [10000,15000,17000,20000,23500,25000,28000,30000,56000,60000,80000].includes(r.amt), cat: '매출_단기권' },
    { fn: r => r.amt === 109500, cat: '매출_기타' },
  ],
  out: [
    { fn: r => r.name.includes('월세') && r.amt > 2000000, cat: '특수_구월세(종료)' },
    { keys: ['인테리어할부'], cat: '고정비_인테리어할부' },
    { keys: ['남기표'], cat: '변동_시설' },
    { keys: ['이동신'], cat: '고정비_인건비(이동신)' },
    { keys: ['전유진','요가 급여'], cat: '고정비_인건비(요가)' },
    { keys: ['로몬'], cat: '고정비_인건비(로몬)' },
    { keys: ['플레이스'], cat: '고정비_마케팅(플레이스)' },
    { keys: ['텐텐마케팅','김혜련'], cat: '고정비_마케팅(텐텐)' },
    { keys: ['네이버광고','네이버 9052'], cat: '변동_마케팅' },
    { keys: ['인스타'], cat: '변동_마케팅', memo: true },
    { keys: ['전단지','전단지할머니','백주현'], cat: '변동_마케팅' },
    { keys: ['포스터','시트지','에어간판','현수막','애드피아','성은선'], cat: '변동_마케팅' },
    { keys: ['스티커'], cat: '변동_마케팅', memo: true },
    { keys: ['법인으로'], cat: '내부이체_개→법' },
    { keys: ['트레드밀'], cat: '변동_기자재' },
    { keys: ['철봉'], cat: '변동_기자재' },
    { keys: ['이명환','굿즈 티셔츠','하이록스 티셔츠'], cat: '특수_굿즈제작' },
    { keys: ['잔디 롤매트'], cat: '특수_시설' },
    { keys: ['세탁비'], cat: '변동_소모품' },
    { keys: ['회식비'], cat: '특수_이벤트' },
    { keys: ['펜션'], cat: '엠티_지출' },
    { keys: ['황태','샤브','닭갈비','좋은날','방이'], cat: '엠티_지출' },
    { fn: r => r.name.includes('이기훈') && r.memo && r.memo.includes('고기값'), cat: '엠티_지출' },
    { keys: ['삼시세끼','광릉불고기','점심식사'], cat: '변동_식비' },
    { keys: ['닭가슴살'], cat: '변동_소모품' },
    { keys: ['음료구매','씨유','모박사'], cat: '변동_소모품' },
    { keys: ['쿠팡'], cat: '변동_소모품' },
    { keys: ['고무판','모래주머니','스키 줄','머리끈','신용운','프린트카페','로젠','손목거치대'], cat: '변동_소모품' },
    { keys: ['무릎보호대','수건'], cat: '변동_소모품', memo: true },
    { keys: ['이사 보증금'], cat: '특수_이사' },
    { fn: r => r.name.includes('이사') && r.amt >= 400000, cat: '특수_이사' },
    { keys: ['폐기물처리비'], cat: '특수_이사' },
    { keys: ['환불','환뷸'], cat: '매출조정_환불출금' },
    { keys: ['거스름돈','페이백'], cat: '매출조정_거스름돈' },
    { keys: ['화환'], cat: '변동_관계비' },
  ]
};

// 기본 분류: 회원권
function classifyCorpIn(name, memo, amt) {
  for (const rule of CORP_RULES.in) {
    if (rule.fn && rule.fn({name, memo, amt})) return rule.cat;
    if (rule.keys && rule.keys.some(k => name.includes(k))) return rule.cat;
  }
  return '매출_기타';
}
function classifyCorpOut(name, memo, amt) {
  for (const rule of CORP_RULES.out) {
    if (rule.fn && rule.fn({name, memo, out: amt})) return rule.cat;
    if (rule.memo && rule.keys && rule.keys.some(k => (memo||'').includes(k))) return rule.cat;
    if (!rule.memo && rule.keys && rule.keys.some(k => name.includes(k))) return rule.cat;
  }
  return '지출_기타';
}
function classPersIn(name, memo, amt) {
  for (const rule of PERS_RULES.in) {
    if (rule.fn && rule.fn({name, memo, amt})) return rule.cat;
    if (rule.keys && rule.keys.some(k => name.includes(k))) return rule.cat;
  }
  return '매출_회원권';
}
function classPerOut(name, memo, amt) {
  for (const rule of PERS_RULES.out) {
    if (rule.fn && rule.fn({name, memo, amt})) return rule.cat;
    if (rule.memo && rule.keys && rule.keys.some(k => (memo||'').includes(k))) return rule.cat;
    if (!rule.memo && rule.keys && rule.keys.some(k => name.includes(k))) return rule.cat;
  }
  return '변동_기타';
}

function readXlsx(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, {type:'array'});
        const sheets = {};
        wb.SheetNames.forEach(n => { sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:''}); });
        res(sheets);
      } catch(err) { rej(err); }
    };
    reader.onerror = rej;
    reader.readAsArrayBuffer(file);
  });
}

function parseCorpSheet(rows) {
  const txs = [];
  for (const row of rows) {
    const dateStr = String(row[2]||'');
    if (!dateStr.match(/^\d{4}\.\d{2}\.\d{2}/)) continue;
    const date = dateStr.substring(0,10).replace(/\./g,'-');
    const name = String(row[6]||'').trim();
    const memo = String(row[10]||row[11]||'').trim();
    const inAmt = parseFloat(String(row[4]).replace(/,/g,''))||0;
    const outAmt = parseFloat(String(row[5]).replace(/,/g,''))||0;
    const bal = parseFloat(String(row[7]).replace(/,/g,''))||0;
    if (!name || (inAmt===0 && outAmt===0)) continue;
    const cat = inAmt > 0 ? classifyCorpIn(name, memo, inAmt) : classifyCorpOut(name, memo, outAmt);
    txs.push({ date, name, memo, in: inAmt, out: outAmt, bal, cat, src: '법인' });
  }
  return txs.sort((a,b) => a.date.localeCompare(b.date));
}

function parsePersSheet(rows) {
  let headerIdx = -1;
  for (let i=0; i<rows.length; i++) {
    if (rows[i].some(c => String(c).includes('거래일시'))) { headerIdx = i; break; }
  }
  if (headerIdx < 0) throw new Error('개인 내역 헤더를 찾을 수 없습니다.');
  const txs = [];
  for (let i=headerIdx+1; i<rows.length; i++) {
    const row = rows[i];
    const dateStr = String(row[1]||'').trim();
    if (!dateStr.match(/^\d{4}\.\d{2}\.\d{2}/)) continue;
    const type = String(row[2]||'').trim();
    if (!['입금','출금'].includes(type)) continue;
    const date = dateStr.substring(0,10).replace(/\./g,'-');
    const amt = Math.abs(parseFloat(String(row[3]).replace(/,/g,''))||0);
    const name = String(row[6]||'').trim();
    const memo = String(row[7]||'').trim();
    const bal = parseFloat(String(row[4]).replace(/,/g,''))||0;
    if (!name || amt===0) continue;
    const cat = type==='입금' ? classPersIn(name, memo, amt) : classPerOut(name, memo, amt);
    txs.push({ date, name, memo, type, amt, bal, cat, src: '개인' });
  }
  return txs.sort((a,b) => a.date.localeCompare(b.date));
}

const REV_CATS_CORP = ['매출_카드정산','매출_온라인(쿠팡)'];
const REV_CATS_PERS = ['매출_회원권','매출_단기권','매출_시루정산','매출_천원냉장고','매출_소액기타','매출_온라인(의류)','매출_기타'];
const FIXED_CORP = ['고정비_임대료','고정비_임대관리비','고정비_법인카드결제','고정비_렌탈','고정비_통신비','고정비_세무수수료','고정비_기타','고정비_알고케어','고정비_마케팅(텐텐)','고정비_알바비(권준학)'];
const FIXED_PERS = ['고정비_인건비(이동신)','고정비_인건비(요가)','고정비_인건비(로몬)','고정비_인테리어할부','고정비_마케팅(플레이스)','고정비_마케팅(텐텐)'];

const CAT_COLORS = {
  '마케팅':'#3b82f6','소모품':'#22c55e','기자재':'#f59e0b',
  '장비(심박수)':'#8b5cf6','식비':'#ef4444','시설':'#6b7280','관계비':'#ec4899','기타':'#9ca3af'
};

function fmt(n) {
  if (n === undefined || n === null || isNaN(n)) return '-';
  return Math.round(n).toLocaleString();
}

function getMonth(d) { return parseInt(d.substring(5,7)); }

function calcMonth(corpTxs, persTxs, month) {
  const cm = corpTxs.filter(t => getMonth(t.date) === month);
  const pm = persTxs.filter(t => getMonth(t.date) === month);

  // 잔고
  let corpStart = 0, corpEnd = 0;
  if (cm.length) {
    const first = cm[0];
    corpStart = first.in > 0 ? first.bal - first.in : first.bal + first.out;
    corpEnd = cm[cm.length-1].bal;
  }
  let persStart = 0, persEnd = 0;
  if (pm.length) {
    const first = pm[0];
    persStart = first.type==='출금' ? first.bal + first.amt : first.bal - first.amt;
    persEnd = pm[pm.length-1].bal;
  }

  // 매출
  const corpRev = cm.filter(t => REV_CATS_CORP.includes(t.cat)).reduce((s,t)=>s+t.in, 0);
  const persRev = pm.filter(t => t.type==='입금' && REV_CATS_PERS.includes(t.cat)).reduce((s,t)=>s+t.amt, 0);
  const totalRev = corpRev + persRev;

  // 매출 세부
  const cardRev = cm.filter(t=>t.cat==='매출_카드정산').reduce((s,t)=>s+t.in,0);
  const siruRev = pm.filter(t=>t.type==='입금'&&t.cat==='매출_시루정산').reduce((s,t)=>s+t.amt,0);
  const cashMem = pm.filter(t=>t.type==='입금'&&t.cat==='매출_회원권').reduce((s,t)=>s+t.amt,0);
  const cashShort = pm.filter(t=>t.type==='입금'&&t.cat==='매출_단기권').reduce((s,t)=>s+t.amt,0);
  const fridge = pm.filter(t=>t.type==='입금'&&t.cat==='매출_천원냉장고').reduce((s,t)=>s+t.amt,0);
  const etcRev = pm.filter(t=>t.type==='입금'&&['매출_온라인(의류)','매출_소액기타','매출_기타'].includes(t.cat)).reduce((s,t)=>s+t.amt,0);

  // 고정비
  const fc = cm.filter(t=>FIXED_CORP.includes(t.cat)).reduce((s,t)=>s+t.out,0);
  const fp = pm.filter(t=>t.type==='출금'&&FIXED_PERS.includes(t.cat)).reduce((s,t)=>s+t.amt,0);
  const totalFixed = fc + fp;

  // 변동비
  const vc = cm.filter(t=>t.cat.startsWith('변동_')).reduce((s,t)=>s+t.out,0);
  const vp = pm.filter(t=>t.type==='출금'&&t.cat.startsWith('변동_')).reduce((s,t)=>s+t.amt,0);
  const totalVar = vc + vp;

  // 변동비 세부
  const varItems = [];
  cm.filter(t=>t.cat.startsWith('변동_')).forEach(t => varItems.push({date:t.date.substring(5),name:t.name,cat:t.cat.replace('변동_',''),amt:t.out,bank:'법인',memo:t.memo}));
  pm.filter(t=>t.type==='출금'&&t.cat.startsWith('변동_')).forEach(t => varItems.push({date:t.date.substring(5),name:t.name,cat:t.cat.replace('변동_',''),amt:t.amt,bank:'개인',memo:t.memo}));
  varItems.sort((a,b)=>a.date.localeCompare(b.date));

  // 특수지출
  const specialCatsCorp = ['특수_구사무실(종료)','특수_투자회수','특수_세무조정'];
  const specialCatsPers = ['특수_구월세(종료)','특수_굿즈제작','특수_시설','특수_이벤트','특수_이사'];
  const spC = cm.filter(t=>specialCatsCorp.includes(t.cat)).reduce((s,t)=>s+t.out,0);
  const spP = pm.filter(t=>t.type==='출금'&&specialCatsPers.includes(t.cat)).reduce((s,t)=>s+t.amt,0);

  const opIncome = totalRev - totalFixed - totalVar;

  // 고정비 세부
  const fixedDetail = [];
  cm.filter(t=>FIXED_CORP.includes(t.cat)).forEach(t=>fixedDetail.push({name:t.name,cat:t.cat.replace('고정비_',''),amt:t.out,bank:'법인'}));
  pm.filter(t=>t.type==='출금'&&FIXED_PERS.includes(t.cat)).forEach(t=>fixedDetail.push({name:t.name,cat:t.cat.replace('고정비_',''),amt:t.amt,bank:'개인'}));

  return {
    month, corpStart, corpEnd, persStart, persEnd,
    totalStart: corpStart+persStart, totalEnd: corpEnd+persEnd,
    totalRev, corpRev, persRev, cardRev, siruRev, cashMem, cashShort, fridge, etcRev,
    totalFixed, fixedCorp: fc, fixedPers: fp,
    totalVar, varCorp: vc, varPers: vp, varItems,
    totalSpecial: spC+spP, opIncome, fixedDetail
  };
}

let analysisData = null;

async function analyze() {
  document.getElementById('error-msg').style.display = 'none';
  document.getElementById('upload-section').style.display = 'none';
  document.getElementById('loading').style.display = 'block';

  try {
    const [corpSheets, persSheets] = await Promise.all([readXlsx(files.corp), readXlsx(files.pers)]);
    const corpRows = Object.values(corpSheets)[0];
    const persRows = Object.values(persSheets)[0];

    const corpTxs = parseCorpSheet(corpRows);
    const persTxs = parsePersSheet(persRows);

    // 포함된 월 감지
    const months = [...new Set([...corpTxs, ...persTxs].map(t => getMonth(t.date)))].sort();

    const results = {};
    months.forEach(m => { results[m] = calcMonth(corpTxs, persTxs, m); });

    analysisData = { results, months, corpTxs, persTxs };

    document.getElementById('loading').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';

    // 월 배지
    const yr = corpTxs[0]?.date.substring(0,4) || new Date().getFullYear();
    document.getElementById('month-badge').textContent = `${yr}년 ${months[0]}~${months[months.length-1]}월`;

    renderDashboard(results, months);
  } catch(err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('upload-section').style.display = 'block';
    const em = document.getElementById('error-msg');
    em.textContent = '파일 분석 중 오류: ' + err.message;
    em.style.display = 'block';
  }
}

}

function renderMonthDetail(r, mn) {
  const varBycat = {};
  r.varItems.forEach(i => { (varBycat[i.cat]=varBycat[i.cat]||[]).push(i); });

  let drillHTML = '';
  Object.entries(varBycat).forEach(([cat, items]) => {
    const catTotal = items.reduce((s,i)=>s+i.amt,0);
    const col = CAT_COLORS[cat]||'#9ca3af';
    const itemRows = items.map(i => `
      <div class="drill-item">
        <span class="drill-date">${i.date}</span>
        <span class="drill-name">${i.name} ${i.memo?`<span style="color:var(--text3);font-size:10px">(${i.memo})</span>`:''}</span>
        <span class="drill-bank ${i.bank==='법인'?'bdg-corp':'bdg-pers'}">${i.bank}</span>
        <span class="drill-item-amt">${fmt(i.amt)}</span>
      </div>`).join('');
    drillHTML += `
      <div class="drill-group">
        <div class="drill-group-header">
          <span class="drill-cat-label">
            <span class="drill-cat-dot" style="background:${col}"></span>${cat}
          </span>
          <span class="drill-cat-total">${fmt(catTotal)}</span>
        </div>
        ${itemRows}
      </div>`;
  });

  const totalVarAll = r.varItems.reduce((s,i)=>s+i.amt,0);
  drillHTML += `<div class="drill-subtotal"><span>합계</span><span style="color:var(--red)">${fmt(totalVarAll)}원</span></div>`;

  return `
    <div class="mg">
      <div class="metric"><div class="metric-label">통합 월초잔고</div><div class="metric-value">${fmt(r.totalStart)}</div></div>
      <div class="metric"><div class="metric-label">총 매출</div><div class="metric-value g">${fmt(r.totalRev)}</div></div>
      <div class="metric"><div class="metric-label">영업 이익</div><div class="metric-value g">${fmt(r.opIncome)}</div></div>
      <div class="metric"><div class="metric-label">통합 월말잔고</div><div class="metric-value ${r.totalEnd>=r.totalStart?'g':'r'}">${fmt(r.totalEnd)}</div></div>
    </div>
    ${r.totalSpecial > 0 ? `<div class="alert alert-warn">특수 지출 ${fmt(r.totalSpecial)}원 발생 (잔고에 영향, 영업이익 별도)</div>` : '<div class="alert alert-success">이번 달 특수지출 없음 — 정상 운영 구조</div>'}
    <div class="card">
      <div class="row"><span class="row-name">카드정산</span><span class="row-amt g">${fmt(r.cardRev)}</span></div>
      <div class="row"><span class="row-name">시루정산 (이기현)</span><span class="row-amt g">${fmt(r.siruRev)}</span></div>
      <div class="row"><span class="row-name">현금 회원권</span><span class="row-amt g">${fmt(r.cashMem)}</span></div>
      <div class="row"><span class="row-name">단기권</span><span class="row-amt g">${fmt(r.cashShort)}</span></div>
      <div class="row"><span class="row-name">천원냉장고</span><span class="row-amt g">${fmt(r.fridge)}</span></div>
      <div class="row"><span class="row-name">기타</span><span class="row-amt g">${fmt(r.etcRev)}</span></div>
      <div class="row"><span class="row-name">고정비</span><span class="row-amt r">${fmt(r.totalFixed)}</span></div>
      ${r.fixedDetail.map(f=>`
        <div class="row sub"><span class="row-name">${f.name} <span class="bdg ${f.bank==='법인'?'bdg-corp':'bdg-pers'}" style="font-size:9px">${f.bank}</span></span><span class="row-amt r" style="font-size:12px">${fmt(f.amt)}</span></div>
      `).join('')}
      <div class="row clickable" data-drill="${r.month}-var">
        <span class="row-name">변동 사업비 <span class="expand-arrow" id="icon-${r.month}-var">▼</span></span>
        <span class="row-amt r">${fmt(r.totalVar)}</span>
      </div>
      <div class="drill" id="drill-${r.month}-var">${drillHTML}</div>
      ${r.totalSpecial > 0 ? `<div class="row"><span class="row-name" style="color:var(--amber)">특수 지출</span><span class="row-amt o">${fmt(r.totalSpecial)}</span></div>` : ''}
      <div class="row total"><span class="row-name">영업 이익</span><span class="row-amt g">${fmt(r.opIncome)}</span></div>
    </div>
  `;
}

const isDark = true;
const tc = 'rgba(255,255,255,0.4)';
const gc = 'rgba(255,255,255,0.06)';

function drawSummaryChart(results, months, mn) {
  const ctx = document.getElementById('chart-summary');
  if (!ctx) return;
  charts['summary'] = new Chart(ctx, {
    type:'bar',
    data:{
      labels: months.map(m=>mn[m]),
      datasets:[
        {label:'총 매출', data:months.map(m=>results[m].totalRev), backgroundColor:'#2ecc71', borderRadius:4, borderSkipped:false},
        {label:'고정비', data:months.map(m=>results[m].totalFixed), backgroundColor:'#e74c3c', borderRadius:4, borderSkipped:false},
        {label:'영업이익', data:months.map(m=>results[m].opIncome), backgroundColor:'#3b82f6', borderRadius:4, borderSkipped:false},
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.label+': '+c.raw.toLocaleString()+'원'}}},
      scales:{x:{ticks:{color:tc},grid:{color:gc}},y:{ticks:{color:tc,callback:v=>(v/10000).toFixed(0)+'만'},grid:{color:gc}}}}
  });
}

function drawRevenueChart(results, months, mn) {
  const ctx = document.getElementById('chart-revenue');

}
